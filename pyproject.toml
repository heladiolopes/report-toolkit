[project]
name = "report-toolkit"
version = "1.0.0"
description = "Compose analytical reports in Python and render them as HTML"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "report-toolkit contributors"}]
dependencies = ["mistune>=3,<4"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Markup :: HTML",
]

[project.optional-dependencies]
pandas = ["pandas>=2"]
altair = ["altair>=5"]
matplotlib = ["matplotlib>=3.7"]
plotly = ["plotly>=5"]
templates = ["PyYAML>=6,<7"]
all = ["pandas>=2", "altair>=5", "matplotlib>=3.7", "plotly>=5", "PyYAML>=6,<7"]
offline = ["altair>=5", "vl-convert-python>=1"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9", "build>=1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
report_toolkit = ["resources/*.css", "resources/*.js"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.ruff.format]
quote-style = "single"
indent-style = "space"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402"]
"**/{tests,docs,tools}/*" = ["E402"]

